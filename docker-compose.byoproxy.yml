# RMMWay BYO-reverse-proxy override (A-1, "bring-your-own reverse proxy").
#
# Use this override when you run your OWN reverse proxy (Nginx, Traefik,
# HAProxy, or your own Caddy) in front of the stack instead of the bundled
# Caddy edge. It does two things:
#
#   1. It is combined with the base file WITHOUT the "edge" profile, so the
#      bundled Caddy container is not started and host ports 80/443 are left
#      free for your proxy.
#   2. It publishes the operator API (server:8080) and the SPA
#      (frontend:8080) on the host, so a host-level proxy can forward to them.
#
# Bring it up with:
#   make prod-byoproxy
#   # == docker compose --env-file .env.prod \
#   #      -f docker-compose.prod.yml -f docker-compose.byoproxy.yml up -d --build
#
# Your proxy then terminates TLS and forwards (see README "Bring your own
# reverse proxy" for full Nginx + Caddy examples):
#   /api/*  /agent/*  /healthz*  ->  localhost:${RMMWAY_HTTP_PORT:-8080}
#   everything else (the SPA)     ->  localhost:${RMMWAY_FRONTEND_PORT:-8081}
#
# The mTLS gRPC agent channel (RMMWAY_AGENT_MTLS_PORT, default 50052) is
# published directly by the server either way and is unchanged.
#
# Alternative (containerized proxy): instead of publishing host ports, attach
# your proxy container to the shared "rmmway-prod" network and proxy
# server:8080 / frontend:8080 directly — no host ports needed.

services:
  server:
    ports:
      - "${RMMWAY_HTTP_PORT:-8080}:8080"
  frontend:
    ports:
      - "${RMMWAY_FRONTEND_PORT:-8081}:8080"
