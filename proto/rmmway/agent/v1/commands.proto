// Commands — server→agent dispatch over the Stream downlink. W1-5 mints and
// sends commands; W3-3 adds per-action capability tokens that gate which
// commands an agent may execute.
//
// Capability tokens (W3-3): every dispatched action carries a short-lived
// capability token (capability_token, a compact JWT signed ES256 by the org
// root CA — the same trust anchor the agent pins from enroll). A token is
// bound to ONE device (sub), ONE capability (cap: rmmway.run_script /
// rmmway.reboot) and ONE command id (cmd/jti), and expires after a short
// window (server RMMWAY_CAP_TTL, default 10m). The agent verifies signature
// + device + capability + expiry against its pinned org root BEFORE acting;
// any failure is answered with CommandResult.status=REFUSED and the command
// is not executed. The channel being a valid mTLS+JWT session is not enough
// on its own — the agent can't act beyond the minted scope.
syntax = "proto3";

package rmmway.agent.v1;

option go_package = "github.com/welcometotheweb/rmmway/proto/gen/rmmway/agent/v1";

// Command is one requested action. The agent acknowledges receipt with a
// CommandResult(status=RECEIVED), executes, then sends a final
// CommandResult with the outcome. Unknown types must be answered with
// UNSUPPORTED (not silently dropped) so the server can retry or escalate.
message Command {
  string id = 1;                // server-unique, used to correlate results
  int64 issued_at_ms = 2;

  oneof action {
    RunScript run_script = 10;
    Reboot reboot = 11;
    // gap #4: deep inventory collection command.
    CollectInventory collect_inventory = 20;
    // Reserved range 30-39: remediation actions (W5-1 playbooks).
    // gap #1a: file transfer (range 50-59).
    FilePull file_pull = 50;
    FilePush file_push = 51;
    // gap #4: patch management commands (range 60-69).
    PatchQuery patch_query = 60;
    PatchApprove patch_approve = 61;
    PatchApply patch_apply = 62;
  }

  // Max seconds before the server considers this command failed. 0 = agent
  // default.
  int32 timeout_s = 40;
}

// RunScript executes a small, signed script (base64 payload; the signing +
// verification story is W3-4/W4-2). v1 is read-only by default.
message RunScript {
  string lang = 1;      // "sh" | "powershell" | "python"
  string script_b64 = 2;
  repeated string args = 3;
  // W3-3: capability token authorizing this specific action on this device
  // (verified by the agent before execution; see the file header).
  string capability_token = 4;
}

// Reboot restarts the agent host. High-impact: gated by the W3-3 capability
// token (cap=rmmway.reboot) exactly like run_script.
message Reboot {
  int32 delay_s = 1;    // 0 = immediate
  string capability_token = 2;
}

// FilePull (gap #1a) copies ONE file from the agent host to the server.
// The agent reads path in 256 KiB blocks and ships each as a FileChunk
// frame (command_id correlation, 0-based seq, eof on the final chunk),
// then reports SUCCEEDED (stdout_tail = "<bytes> bytes") or FAILED.
// Capability: rmmway.file_pull.
message FilePull {
  // Absolute path on the agent host.
  string path = 1;
  // W3-3: capability token (cap=rmmway.file_pull).
  string capability_token = 2;
}

// FilePush (gap #1a) writes a file on the agent host, replacing any
// existing file. The content rides either inline (content_b64 — small
// files, the server caps this) or as FileChunk downlink frames (a chunked
// push dispatches the command first and streams the blocks immediately
// after; the agent blocks on the eof chunk). mode is an octal string
// ("0644"); empty = the platform default. Capability: rmmway.file_push.
message FilePush {
  string path = 1;
  // Inline content (base64). Empty = the push is chunked (FileChunk frames
  // follow the command on the same stream).
  string content_b64 = 2;
  // Octal mode, e.g. "0644" (applied when non-empty and parseable).
  string mode = 3;
  // W3-3: capability token (cap=rmmway.file_push).
  string capability_token = 4;
}

// CollectInventory (gap #4) triggers deep inventory collection on the
// agent. The agent collects hardware, software, services, and user account
// information and reports it back as an InventoryReport frame. Capability:
// rmmway.collect_inventory.
message CollectInventory {
  // W3-3: capability token (cap=rmmway.collect_inventory).
  string capability_token = 1;
}

// PatchQuery (gap #4) queries available patches on the agent. On Windows,
// this uses the Windows Update API (WUAPI) to check for available updates.
// Results are reported as a PatchStatus frame with a PatchQueryResult.
// Capability: rmmway.patch_query.
message PatchQuery {
  // Optional: filter by severity ("critical", "important", etc.).
  // Empty = all severities.
  string severity_filter = 1;
  // W3-3: capability token (cap=rmmway.patch_query).
  string capability_token = 2;
}

// PatchApprove (gap #4) approves specific patches for installation.
// Approvals are staged; patch_apply actually installs them. Capability:
// rmmway.patch_approve.
message PatchApprove {
  // List of patch IDs to approve (from a previous patch_query result).
  repeated string patch_ids = 1;
  // W3-3: capability token (cap=rmmway.patch_approve).
  string capability_token = 2;
}

// PatchApply (gap #4) installs the approved patches. On Windows, this uses
// the Windows Update API to download and install approved updates. Results
// are reported as PatchStatus frames with PatchApplyProgress. Capability:
// rmmway.patch_apply.
message PatchApply {
  // List of patch IDs to apply (from a previous patch_approve).
  // Empty = apply all approved patches.
  repeated string patch_ids = 1;
  // Schedule a reboot after installation if required.
  bool schedule_reboot = 2;
  // Reboot delay in seconds (applied if schedule_reboot and required).
  uint32 reboot_delay_seconds = 3;
  // W3-3: capability token (cap=rmmway.patch_apply).
  string capability_token = 4;
}

// CommandResult is the agent's report back (sent as a future StreamRequest
// extension; the field is defined here for versioning stability).
message CommandResult {
  string command_id = 1;

  enum Status {
    STATUS_UNSPECIFIED = 0;
    RECEIVED = 1;
    RUNNING = 2;
    SUCCEEDED = 3;
    FAILED = 4;
    TIMED_OUT = 5;
    UNSUPPORTED = 6;
    REFUSED = 7;   // capability check failed (W3-3)
  }

  Status status = 2;
  int32 exit_code = 3;
  string stdout_tail = 4;  // last 4KB
  string stderr_tail = 5;
  string error = 6;
  int64 completed_at_ms = 7;
}
