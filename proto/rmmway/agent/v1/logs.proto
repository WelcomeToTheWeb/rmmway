// Logs — the structured agent-log push contract (W6-1). The agent tails its
// own structured (JSON-lines) log events and ships them two ways:
//   1. to Loki over the HTTP push API (queryable in the log stack), and
//   2. here, as LogBatch frames on the existing Stream uplink, where the
//      server keeps the indexed events in the log_events Timescale
//      hypertable so the RMM can surface recent events per device.
//
// Delivery is at-least-once: every entry carries a stable agent-generated
// id (content-derived), so the server dedups by id (ON CONFLICT DO NOTHING)
// and a re-sent batch after a reconnect is a no-op — same replay story as
// MetricBatch (IDEA.md §1 outbox).
syntax = "proto3";

package rmmway.agent.v1;

option go_package = "github.com/welcometotheweb/rmmway/proto/gen/rmmway/agent/v1";

// LogEntry is one structured log event from an agent.
message LogEntry {
  // Stable unique id generated by the AGENT (content-derived), part of the
  // server-side dedup key. Replay-safe: re-sending the same entry is a no-op.
  string id = 1;
  // Agent wall clock of the event, Unix ms.
  int64 timestamp_ms = 2;
  // Severity: DEBUG | INFO | WARN | ERROR (slog levels).
  string level = 3;
  // The log message.
  string msg = 4;
  // Structured attributes (slog key/values, stringified).
  map<string, string> attrs = 5;
}

// LogBatch is one push of structured log events on the Stream uplink.
message LogBatch {
  repeated LogEntry entries = 1;
}
