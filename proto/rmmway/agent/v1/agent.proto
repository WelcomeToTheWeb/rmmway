// AgentService — the single gRPC surface between an RMMWay agent and the
// server. W0-2 defines the contract; W1-4 (agent enroll) and W1-5 (server
// ingest) implement it.
//
// Auth model:
//   - Bootstrap channel (W1-5): the agent authenticates every RPC with the
//     enroll JWT in the `Authorization: Bearer <jwt>` metadata header. A
//     freshly bootstrapped agent has no mTLS material yet, so it enrolls over
//     this channel.
//   - mTLS channel (W3-1): after enroll the server has issued the device a
//     leaf cert + key signed by the org root CA (EnrollResponse
//     leaf_cert_pem/leaf_key_pem). The agent persists them and from then on
//     speaks to the server's mTLS gRPC port only — the handshake itself is
//     the credential. The JWT is still carried in metadata as defense in
//     depth (a leaked leaf cert without a valid JWT for the same device
//     still gets nothing). A random / externally-issued client cert is
//     rejected at the TLS layer, before any RPC is processed.
syntax = "proto3";

package rmmway.agent.v1;

option go_package = "github.com/welcometotheweb/rmmway/proto/gen/rmmway/agent/v1";

import "rmmway/agent/v1/metrics.proto";
import "rmmway/agent/v1/commands.proto";
import "rmmway/agent/v1/logs.proto";

service AgentService {
  // Enroll is the first contact for a freshly bootstrapped agent. It proves
  // the bootstrap token (a one-time code minted at bootstrap time) and
  // receives the device's persistent identity: a device_id and a long-lived
  // agent JWT used for every subsequent RPC. A device that already has a
  // persisted token never calls Enroll again (restart must not re-enroll).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Stream is the agent's long-lived uplink. The agent sends Heartbeats
  // (with optional MetricBatches attached) and receives Commands. If the
  // connection drops, the agent reconnects with exponential backoff and
  // replays spooled metrics (server-side dedup by (device_id, metric, ts)).
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);

  // RefreshLeaf (W3-2) re-issues the calling device's mTLS leaf while the
  // OLD leaf is still valid: the agent calls it over the mTLS channel it
  // already holds (presenting the current leaf + its agent JWT), the server
  // signs a fresh short-lived leaf (RMMWAY_LEAF_TTL, default ~1h) and the
  // agent swaps it in without dropping the uplink. This is what keeps leaf
  // lifetimes short without a gap: rotation always happens well inside the
  // previous cert's validity window.
  rpc RefreshLeaf(RefreshLeafRequest) returns (RefreshLeafResponse);
}

// EnrollRequest proves a fresh agent's right to join the estate.
message EnrollRequest {
  // One-time bootstrap token embedded in the curl|sh bootstrap line.
  string bootstrap_token = 1;

  // Host facts reported up front so the server can create the device row
  // (W1-6) before the first heartbeat.
  string hostname = 2;
  string os = 3;       // "linux" | "windows" | "darwin"
  string arch = 4;     // "amd64" | "arm64" | ...
  string agent_version = 5;

  // First pass at static inventory; full inventory arrives with heartbeats.
  // Kept intentionally small in v1 — richer inventory lands with W1-7.
  repeated string interfaces = 6;  // "eth0:10.0.0.5/24" style
}

// EnrollResponse hands the agent its persistent identity.
message EnrollResponse {
  string device_id = 1;      // server-assigned, stable across restarts
  string jwt = 2;            // agent token; persisted on the agent's disk
  int32 heartbeat_interval_s = 3;
  int32 metric_interval_s = 4;

  // W3-1: the device's mTLS identity, minted by the server's org root CA.
  // The agent persists these (PEM, root-only) and from then on speaks to the
  // server's mTLS gRPC port only. `org_root_ca` is the CA that signed
  // `leaf_cert_pem` — the agent pins it to verify the server's own
  // certificate on the mTLS port (mutual trust, not just client auth).
  string leaf_cert_pem = 5;    // the device's leaf cert, signed by the org root
  string leaf_key_pem = 6;     // the device's private key (PEM, never leaves the agent)
  string org_root_ca_pem = 7;  // the org root CA, pinned client-side
}

// RefreshLeafRequest (W3-2) asks the server to re-issue this device's leaf.
// It is called from the mTLS channel the agent ALREADY holds (presenting the
// current leaf + its agent JWT in metadata), so the old cert must still be
// valid when it is sent — the rotation window is chosen well inside the
// cert's validity. The request body carries only what the server needs to
// re-issue with the same identity.
message RefreshLeafRequest {
  // The device's hostname (SAN for the new leaf, matching what enroll sent).
  string hostname = 1;
  // The not-after of the leaf the agent is CURRENTLY presenting (Unix ms).
  // Lets the server prove the request came with an unexpired identity and
  // lets the response report the rotation delta for logging/telemetry.
  int64 current_leaf_expires_ms = 2;
}

// RefreshLeafResponse carries the fresh leaf; the org root is unchanged (the
// agent already pins it from enroll).
message RefreshLeafResponse {
  string leaf_cert_pem = 1;  // the new leaf, signed by the same org root
  string leaf_key_pem = 2;   // the new private key (PEM, never leaves the agent)
  // The new leaf's not-after (Unix ms) — the agent's next rotation deadline
  // is derived from this, not from its own clock.
  int64 expires_ms = 3;
}

// StreamRequest is one uplink frame on Stream.
message StreamRequest {
  oneof payload {
    Heartbeat heartbeat = 1;
    MetricBatch metrics = 2;
    // W3-3: the agent's report on a dispatched command. Sent first as
    // RECEIVED (the command was accepted + its capability token verified),
    // then again with the final status (SUCCEEDED / FAILED / TIMED_OUT /
    // REFUSED / UNSUPPORTED). REFUSED means the capability check failed —
    // the agent did NOT execute the command.
    CommandResult command_result = 3;
    // W6-1: structured agent-log events (the agent tails its own JSON-lines
    // log and ships each batch here AND to Loki). Server-side dedup by
    // entry id makes the at-least-once replay safe.
    LogBatch logs = 4;
    // gap #1a: one screen frame of a live remote session (view-only,
    // phase 1). The agent streams these at the SessionControl.open rate
    // while a session is active; the server relays only the latest frame
    // per session (drop-old) to browser viewers.
    SessionFrame session_frame = 5;
    // gap #1a: one block of a file transfer (a file_pull payload, or a
    // file_push payload when the push is chunked rather than inline).
    // Correlated to its dispatching command by command_id.
    FileChunk file_chunk = 6;
    // gap #4: deep inventory report (triggered by an inventory command).
    // One uplink frame containing the collected inventory for this device.
    InventoryReport inventory_report = 7;
    // gap #4: patch status update (triggered by patch commands).
    // Contains the status of queried/applicable/installed patches.
    PatchStatus patch_status = 8;
  }
}

// StreamResponse is one downlink frame on Stream.
message StreamResponse {
  oneof payload {
    HeartbeatAck heartbeat_ack = 1;
    Command command = 2;
    // gap #1a: open/close the agent's capture loop.
    SessionControl session_control = 3;
    // gap #1a: one block of an incoming file (a chunked file_push).
    FileChunk file_chunk = 4;
  }
}

// Heartbeat keeps the device "online" and can piggyback metrics to save
// round-trips.
message Heartbeat {
  int64 timestamp_ms = 1;            // agent wall clock, Unix ms
  double cpu_percent = 2;            // convenience: current CPU load
  double memory_percent = 3;
  string state = 4;                  // "active" | "degraded" | "offline" (agent self-report)
  // Optional metrics attached to this beat; a dedicated MetricBatch frame
  // is used for bulk pushes.
  MetricBatch metrics = 5;
}

// HeartbeatAck lets the server steer the agent's cadence live.
message HeartbeatAck {
  int64 server_time_ms = 1;          // for clock skew correction
  int32 heartbeat_interval_s = 2;    // 0 = keep current
  int32 metric_interval_s = 3;
  // H3: a RENEWED agent JWT. The agent JWT has a finite lifetime (720h) and
  // the agent never re-enrolls, so the server hands back a fresh token once
  // the stream's token is into its last quarter of validity. The agent
  // persists it and uses it from the next reconnect onward — a device that
  // keeps heartbeating never hits the expiry wall. Empty = no renewal this
  // beat (the current token still has plenty of life).
  string jwt = 4;
}

// SessionFrame (gap #1a, phase 1 = view-only) is one captured screen frame
// of a live remote session. Phase 1 ships JPEG over the existing mTLS
// Stream (no new channel): a frame is a few hundred KB at most, the agent
// captures at the opened rate, and the server relays only the LATEST frame
// per session to its viewers (drop-old) — a slow browser simply sees a
// lower rate, it never backs the agent up.
message SessionFrame {
  // Echo of the SessionControl.open session_id (one session per device in
  // phase 1; the id lets a viewer validate it is following the right feed).
  string session_id = 1;
  // Monotonic frame counter for this session (resets per open). Viewers use
  // it to detect drops.
  uint64 seq = 2;
  // Codec hint; phase 1 is always "jpeg".
  string codec = 3;
  uint32 width = 4;
  uint32 height = 5;
  // The frame (empty on a status frame below).
  bytes jpeg = 6;
  // Agent wall clock (Unix ms) at capture.
  int64 capture_ts_ms = 7;
  // Non-empty = capture-unavailable STATUS frame (jpeg is empty): the
  // viewer renders the status instead of a frame. Phase 1 values:
  // "vnc_required" — no local display to capture (e.g. a headless Linux
  // box); opening a local VNC session makes frames follow; "unavailable"
  // — the capture backend errored. Status frames are throttled on the
  // agent (not one per tick) so they cannot crowd out real frames.
  string status = 8;
}

// SessionControl (gap #1a) is the downlink that drives the agent's capture
// loop. open starts capturing at fps (0 = agent default ~2 fps, capped at
// 30); close stops it and releases the capture backend. A repeated open for
// an active session with a changed fps live-adjusts the rate. Phase 2 adds
// mouse/keyboard input relay for two-way remote control.
message SessionControl {
  oneof action {
    OpenSession open = 1;
    CloseSession close = 2;
    // gap #1b: input relay frames (phase 2, two-way remote control).
    MouseEvent mouse_event = 10;
    KeyboardEvent keyboard_event = 11;
  }
  message OpenSession {
    // Server-minted session id; echoed in every SessionFrame.
    string session_id = 1;
    // Frame-rate hint (frames per second; 0 = agent default).
    int32 fps = 2;
  }
  message CloseSession {
    string session_id = 1;
  }
  // Mouse event to relay to the remote desktop. Coordinates are absolute
  // within the captured display (origin at top-left, x grows right, y grows
  // down). Buttons follow standard button numbers: left=0, middle=1, right=2.
  message MouseEvent {
    string session_id = 1;
    // Event type.
    string event_type = 2;  // "move" | "down" | "up" | "click" | "wheel"
    int32 x = 3;
    int32 y = 4;
    // Button number (0=left, 1=middle, 2=right); 0 for move/wheel events.
    int32 button = 5;
    // Wheel delta (positive=up, negative=down); 0 for non-wheel events.
    int32 wheel_delta = 6;
  }
  // Keyboard event to relay. Uses Unicode codepoint representation for
  // portability across locales. Modifier keys are sent as separate events.
  message KeyboardEvent {
    string session_id = 1;
    // Event type.
    string event_type = 2;  // "down" | "up" | "key"
    // Unicode codepoint of the character (e.g. 65 for 'A'). 0 for
    // modifier-only events (shift, ctrl, alt, etc.).
    uint32 codepoint = 3;
    // Modifier bitmask: shift=1, ctrl=2, alt=4, meta/windows=8.
    uint32 modifiers = 4;
  }
}

// FileChunk (gap #1a) is one block of a file transfer, MaxFileChunkBytes
// (256 KiB) max. It rides BOTH directions of Stream: a file_pull streams the
// source file UP (agent -> server); a chunked file_push streams the content
// DOWN (server -> agent) — an inline push (FilePush.content_b64) uses no
// chunks at all. Correlation: command_id is the dispatching Command's id;
// seq is 0-based and ordered; the eof chunk carries the final (possibly
// empty) block and closes the transfer.
message FileChunk {
  string command_id = 1;
  uint64 seq = 2;
  bytes data = 3;
  bool eof = 4;
  // file_pull only: the source file's total size (from stat) so the server
  // can report progress. 0 = unknown.
  int64 total_bytes = 5;
  // file_pull only: the source file's mode (as an octal int, e.g. 0644).
  // The server records it for the download (phase 1 does not re-apply it).
  uint32 source_mode = 6;
}

// ---- gap #4: deep inventory types ----

// InventoryReport is the agent's response to an inventory collection command.
// It contains all inventory categories for this device, collected atomically.
message InventoryReport {
  // The command_id that triggered this report (for correlation).
  string command_id = 1;
  // Unix ms when collection started.
  int64 collected_at_ms = 2;
  // Collected inventory categories (all populated by default).
  HardwareInfo hardware = 10;
  repeated SoftwareInfo software = 11;
  repeated ServiceInfo services = 12;
  repeated UserAccount users = 13;
}

// HardwareInfo captures the device's hardware inventory.
message HardwareInfo {
  string cpu_model = 1;
  string cpu_vendor = 2;
  uint32 cpu_cores = 3;
  uint32 cpu_logical = 4;
  uint64 ram_total_bytes = 5;
  string ram_model = 6;
  string os_name = 7;
  string os_version = 8;
  string os_arch = 9;
  string hostname = 10;
  repeated DomainInfo domains = 11;
  repeated DiskInfo disks = 12;
}

// DomainInfo describes AD/MDM affiliation.
message DomainInfo {
  string type = 1;     // "active_directory" | "apple_business_manager" | "local"
  string name = 2;
  string workgroup = 3;
}

// DiskInfo describes a physical disk's geometry and serial.
message DiskInfo {
  string device = 1;
  string model = 2;
  string serial = 3;
  uint64 size = 4;
  string type = 5;     // "hdd" | "ssd" | "unknown"
}

// SoftwareInfo describes an installed application.
message SoftwareInfo {
  string name = 1;
  string version = 2;
  string vendor = 3;
  string install_date = 4;
  string arch = 5;
  string path = 6;
  string source = 7;   // "dpkg" | "rpm" | "msi" | "registry" | "homebrew" | "pkg"
}

// ServiceInfo describes an installed system service.
message ServiceInfo {
  string name = 1;
  string display_name = 2;
  string status = 3;   // "running" | "stopped" | "paused" | "unknown"
  string type = 4;     // "systemd" | "launchd" | "windows_service"
  bool enabled = 5;
}

// UserAccount describes a local user account on the device.
message UserAccount {
  string username = 1;
  string name = 2;
  string uid = 3;
  string sid = 4;      // Windows SID
  string home_dir = 5;
  string shell = 6;
  bool enabled = 7;
  string account_type = 8;  // "user" | "admin" | "system"
}

// ---- gap #4: patch management types ----

// PatchStatus is the agent's response to a patch query/operation.
message PatchStatus {
  string command_id = 1;
  int64 status_at_ms = 2;
  // Query results (patch_query commands).
  PatchQueryResult query = 10;
  // Apply progress (patch_apply commands).
  PatchApplyProgress apply = 11;
}

// PatchQueryResult contains the results of a patch query.
message PatchQueryResult {
  repeated AvailablePatch available = 1;
  repeated InstalledPatch installed = 2;
}

// AvailablePatch describes a patch that can be applied.
message AvailablePatch {
  string id = 1;
  string title = 2;
  string description = 3;
  string severity = 4;   // "critical" | "important" | "moderate" | "low" | "unrated"
  string kb_article = 5; // Windows KB number, or CVE identifier
  bool reboot_required = 6;
  string download_url = 7;
}

// InstalledPatch describes a patch that has already been applied.
message InstalledPatch {
  string id = 1;
  string title = 2;
  string install_date = 3;
  string kb_article = 4;
}

// PatchApplyProgress reports the progress of a patch apply operation.
message PatchApplyProgress {
  string phase = 1;      // "downloading" | "installing" | "completed" | "failed"
  string message = 2;
  uint32 progress_percent = 3;
  bool reboot_required = 4;
  repeated InstalledPatch installed = 5;
  repeated string errors = 6;
}
