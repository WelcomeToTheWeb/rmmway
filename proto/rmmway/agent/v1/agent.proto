// AgentService — the single gRPC surface between an RMMWay agent and the
// server. W0-2 defines the contract; W1-4 (agent enroll) and W1-5 (server
// ingest) implement it.
//
// Auth model:
//   - Bootstrap channel (W1-5): the agent authenticates every RPC with the
//     enroll JWT in the `Authorization: Bearer <jwt>` metadata header. A
//     freshly bootstrapped agent has no mTLS material yet, so it enrolls over
//     this channel.
//   - mTLS channel (W3-1): after enroll the server has issued the device a
//     leaf cert + key signed by the org root CA (EnrollResponse
//     leaf_cert_pem/leaf_key_pem). The agent persists them and from then on
//     speaks to the server's mTLS gRPC port only — the handshake itself is
//     the credential. The JWT is still carried in metadata as defense in
//     depth (a leaked leaf cert without a valid JWT for the same device
//     still gets nothing). A random / externally-issued client cert is
//     rejected at the TLS layer, before any RPC is processed.
syntax = "proto3";

package rmmway.agent.v1;

option go_package = "github.com/welcometotheweb/rmmway/proto/gen/rmmway/agent/v1";

import "rmmway/agent/v1/metrics.proto";
import "rmmway/agent/v1/commands.proto";
import "rmmway/agent/v1/logs.proto";

service AgentService {
  // Enroll is the first contact for a freshly bootstrapped agent. It proves
  // the bootstrap token (a one-time code minted at bootstrap time) and
  // receives the device's persistent identity: a device_id and a long-lived
  // agent JWT used for every subsequent RPC. A device that already has a
  // persisted token never calls Enroll again (restart must not re-enroll).
  rpc Enroll(EnrollRequest) returns (EnrollResponse);

  // Stream is the agent's long-lived uplink. The agent sends Heartbeats
  // (with optional MetricBatches attached) and receives Commands. If the
  // connection drops, the agent reconnects with exponential backoff and
  // replays spooled metrics (server-side dedup by (device_id, metric, ts)).
  rpc Stream(stream StreamRequest) returns (stream StreamResponse);

  // RefreshLeaf (W3-2) re-issues the calling device's mTLS leaf while the
  // OLD leaf is still valid: the agent calls it over the mTLS channel it
  // already holds (presenting the current leaf + its agent JWT), the server
  // signs a fresh short-lived leaf (RMMWAY_LEAF_TTL, default ~1h) and the
  // agent swaps it in without dropping the uplink. This is what keeps leaf
  // lifetimes short without a gap: rotation always happens well inside the
  // previous cert's validity window.
  rpc RefreshLeaf(RefreshLeafRequest) returns (RefreshLeafResponse);
}

// EnrollRequest proves a fresh agent's right to join the estate.
message EnrollRequest {
  // One-time bootstrap token embedded in the curl|sh bootstrap line.
  string bootstrap_token = 1;

  // Host facts reported up front so the server can create the device row
  // (W1-6) before the first heartbeat.
  string hostname = 2;
  string os = 3;       // "linux" | "windows" | "darwin"
  string arch = 4;     // "amd64" | "arm64" | ...
  string agent_version = 5;

  // First pass at static inventory; full inventory arrives with heartbeats.
  // Kept intentionally small in v1 — richer inventory lands with W1-7.
  repeated string interfaces = 6;  // "eth0:10.0.0.5/24" style
}

// EnrollResponse hands the agent its persistent identity.
message EnrollResponse {
  string device_id = 1;      // server-assigned, stable across restarts
  string jwt = 2;            // agent token; persisted on the agent's disk
  int32 heartbeat_interval_s = 3;
  int32 metric_interval_s = 4;

  // W3-1: the device's mTLS identity, minted by the server's org root CA.
  // The agent persists these (PEM, root-only) and from then on speaks to the
  // server's mTLS gRPC port only. `org_root_ca` is the CA that signed
  // `leaf_cert_pem` — the agent pins it to verify the server's own
  // certificate on the mTLS port (mutual trust, not just client auth).
  string leaf_cert_pem = 5;    // the device's leaf cert, signed by the org root
  string leaf_key_pem = 6;     // the device's private key (PEM, never leaves the agent)
  string org_root_ca_pem = 7;  // the org root CA, pinned client-side
}

// RefreshLeafRequest (W3-2) asks the server to re-issue this device's leaf.
// It is called from the mTLS channel the agent ALREADY holds (presenting the
// current leaf + its agent JWT in metadata), so the old cert must still be
// valid when it is sent — the rotation window is chosen well inside the
// cert's validity. The request body carries only what the server needs to
// re-issue with the same identity.
message RefreshLeafRequest {
  // The device's hostname (SAN for the new leaf, matching what enroll sent).
  string hostname = 1;
  // The not-after of the leaf the agent is CURRENTLY presenting (Unix ms).
  // Lets the server prove the request came with an unexpired identity and
  // lets the response report the rotation delta for logging/telemetry.
  int64 current_leaf_expires_ms = 2;
}

// RefreshLeafResponse carries the fresh leaf; the org root is unchanged (the
// agent already pins it from enroll).
message RefreshLeafResponse {
  string leaf_cert_pem = 1;  // the new leaf, signed by the same org root
  string leaf_key_pem = 2;   // the new private key (PEM, never leaves the agent)
  // The new leaf's not-after (Unix ms) — the agent's next rotation deadline
  // is derived from this, not from its own clock.
  int64 expires_ms = 3;
}

// StreamRequest is one uplink frame on Stream.
message StreamRequest {
  oneof payload {
    Heartbeat heartbeat = 1;
    MetricBatch metrics = 2;
    // W3-3: the agent's report on a dispatched command. Sent first as
    // RECEIVED (the command was accepted + its capability token verified),
    // then again with the final status (SUCCEEDED / FAILED / TIMED_OUT /
    // REFUSED / UNSUPPORTED). REFUSED means the capability check failed —
    // the agent did NOT execute the command.
    CommandResult command_result = 3;
    // W6-1: structured agent-log events (the agent tails its own JSON-lines
    // log and ships each batch here AND to Loki). Server-side dedup by
    // entry id makes the at-least-once replay safe.
    LogBatch logs = 4;
  }
}

// StreamResponse is one downlink frame on Stream.
message StreamResponse {
  oneof payload {
    HeartbeatAck heartbeat_ack = 1;
    Command command = 2;
  }
}

// Heartbeat keeps the device "online" and can piggyback metrics to save
// round-trips.
message Heartbeat {
  int64 timestamp_ms = 1;            // agent wall clock, Unix ms
  double cpu_percent = 2;            // convenience: current CPU load
  double memory_percent = 3;
  string state = 4;                  // "active" | "degraded" | "offline" (agent self-report)
  // Optional metrics attached to this beat; a dedicated MetricBatch frame
  // is used for bulk pushes.
  MetricBatch metrics = 5;
}

// HeartbeatAck lets the server steer the agent's cadence live.
message HeartbeatAck {
  int64 server_time_ms = 1;          // for clock skew correction
  int32 heartbeat_interval_s = 2;    // 0 = keep current
  int32 metric_interval_s = 3;
  // H3: a RENEWED agent JWT. The agent JWT has a finite lifetime (720h) and
  // the agent never re-enrolls, so the server hands back a fresh token once
  // the stream's token is into its last quarter of validity. The agent
  // persists it and uses it from the next reconnect onward — a device that
  // keeps heartbeating never hits the expiry wall. Empty = no renewal this
  // beat (the current token still has plenty of life).
  string jwt = 4;
}
