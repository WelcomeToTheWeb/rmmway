<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>RMMWay</title>
		<!-- Apply the saved theme before first paint (no flash of wrong
		     theme). Dark is the default; light follows the OS preference
		     unless the operator picked one in the top bar. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("rmmway-theme");
					if (t !== "light" && t !== "dark") {
						t =
							window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					}
					document.documentElement.setAttribute("data-theme", t);
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
