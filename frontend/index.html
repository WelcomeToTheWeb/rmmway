<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<!-- Brand mark: the same ◈ diamond-node glyph the top bar renders, on
		     the dark surface. Inline data URI — no network request on a
		     self-hosted install. -->
		<link
			rel="icon"
			href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b0e14'/%3E%3Cpath d='M16 6l10 10-10 10L6 16z' fill='none' stroke='%234f8cff' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%234f8cff'/%3E%3C/svg%3E"
		/>
		<meta
			name="description"
			content="RMMWay — self-hosted remote monitoring and management: devices, commands, alerts, and automatic remediation in one operator console."
		/>
		<meta name="theme-color" content="#0b0e14" />
		<title>RMMWay</title>
		<!-- Apply the saved theme before first paint (no flash of wrong
		     theme). Dark is the default; light follows the OS preference
		     unless the operator picked one in the top bar. -->
		<script>
			(function () {
				try {
					var t = localStorage.getItem("rmmway-theme");
					if (t !== "light" && t !== "dark") {
						t =
							window.matchMedia &&
							window.matchMedia("(prefers-color-scheme: light)").matches
								? "light"
								: "dark";
					}
					document.documentElement.setAttribute("data-theme", t);
				} catch (e) {
					document.documentElement.setAttribute("data-theme", "dark");
				}
			})();
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.jsx"></script>
	</body>
</html>
