# W6-1: Loki single-binary local config (dev stack only).
#
# All storage is on local disk (./data via the loki-data volume); no S3, no
# ring/KV — one instance, replication_factor 1. Agents push with
# POST /loki/api/v1/push (auth disabled); the RMM/e2e query via
# /loki/api/v1/query_range.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

query_range:
  results_cache:
    cache:
      embedded_cache:
        max_size_mb: 100

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  # Loki 3.x requires an explicit delete-request store when retention is on.
  delete_request_store: filesystem

limits_config:
  # The dev stack has one pusher fleet (a handful of agents); generous
  # per-series limits so a bursty agent never gets 400'd mid-push.
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 64
  max_query_series: 20000
  retention_period: 336h  # 14 days
