# W0-3: CI skeleton.
# A push runs lint + test + build for both Go modules, builds the frontend,
# and builds (and on main: pushes) the server Docker image.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# One in-flight run per ref (latest wins).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.27"

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: gofmt (agent)
        working-directory: agent
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: gofmt (server)
        working-directory: server
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (agent)
        working-directory: agent
        run: go vet -tags integration ./...
      - name: go vet (server)
        working-directory: server
        run: go vet ./...
      - name: gofmt (tools/signer)
        working-directory: tools/signer
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet (tools/signer)
        working-directory: tools/signer
        run: go vet ./...
      - name: buf lint
        uses: bufbuild/buf-setup-action@v1
        with:
          version: v1.72.0
      - run: buf lint
      - name: "install.sh unit test (gap #9: mTLS-addr derivation regression)"
        run: ./scripts/test-install-sh.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    # Meilisearch for the W1-7 live indexing tests (skipped when absent).
    # Timescale for the live-Postgres tests (W1-6/W2-3/W2-4/W4-3/W5-1) —
    # superuser user (CREATEDB) so each test can create a scratch database.
    services:
      meilisearch:
        image: getmeili/meilisearch:v1.12
        env:
          MEILI_MASTER_KEY: ci-master-key
        ports:
          - 7700:7700
        options: >-
          --health-cmd "curl -sf http://localhost:7700/health"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: rmmway
          POSTGRES_USER: rmmway
          POSTGRES_PASSWORD: rmmway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmmway -d rmmway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      nats:
        # JetStream stream the W5-2 flow engine + W6-2 webhook framework run
        # over (the e2e deletes/recreates the RMMWAY_EVENTS stream per run).
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --jetstream --port 4222 --http_port 8222
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RMMWAY_MEILI_TEST_ENDPOINT: http://localhost:7700
      RMMWAY_MEILI_TEST_KEY: ci-master-key
      # Enables the live-Postgres tests (each skips itself when unset):
      # migrations, baseline, alerts, heal state machine, client export.
      RMMWAY_TEST_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
      # NATS/JetStream for the W5-2/W6-2 e2e (real event bus).
      RMMWAY_NATS_URL: nats://localhost:4222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go test (agent)
        working-directory: agent
        # -tags integration also runs the W1-4 enroll/uplink end-to-end test
        # (real gRPC server over a socket); it is fast and self-contained.
        run: go test -tags integration ./...
      - name: go test (server)
        working-directory: server
        run: go test ./...
      - name: go test (tools/signer)
        # W3-4: keygen/sign/verify round-trip + interop with keys generated
        # by the reference minisign(1) CLI.
        working-directory: tools/signer
        run: go test ./...
      - name: "update e2e (W4-2: signed release applies; tampered/unsigned refused)"
        # Builds real agent binaries, signs one with a throwaway key via the
        # real signer, serves it through an in-process server, and runs the
        # real agent `update` command: valid -> applied, tampered/unsigned ->
        # refused (binary untouched).
        working-directory: server
        run: go run ./cmd/e2e/update
      - name: "export e2e (W4-3: one-click client export -> self-describing Parquet+JSON bundle)"
        # Real operator HTTP surface on a scratch Timescale DB: export a
        # client, Verify the bundle against its own manifest, tamper-detect,
        # window it, re-read the Parquet with a standard reader, and
        # re-import it into a fresh database.
        working-directory: server
        env:
          RMMWAY_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
        run: go run ./cmd/e2e/export
      - name: "trust e2e (W4-4 MILESTONE: a skeptic verifies a signed release + SBOM, and exports a client + confirms it's theirs)"
        # Closes Block 2. Self-contained: Part A cross-builds the real agent,
        # scans a CycloneDX SBOM with the pinned syft (auto-installed), signs
        # binary+SBOM+SHA256SUMS with the real signer under a throwaway release
        # key, then a fresh trust domain holding ONLY the public key verifies
        # everything with go-minisign (independent impl) — and rejects a
        # tampered byte and a wrong key. Part B enrolls a device on a scratch
        # Timescale DB, does a one-click export through the real operator HTTP
        # surface, and confirms the bundle is theirs (self-describing Verify,
        # identity, exact sample count + spot values + range via a standard
        # Parquet reader, tamper-reject).
        working-directory: server
        env:
          RMMWAY_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
        run: go run ./cmd/e2e/trust
      - name: "webhook e2e (W6-2: a user-defined endpoint gets signed alert/inventory/automation events, with retries + replay + SSE)"
        # Real ingest (enroll -> inventory) + real flow engine (trigger->notify
        # -> automation) + real alert reconciler (-> alert) all publish to a
        # REAL NATS/JetStream bus; the webhook framework journals each event
        # and delivers it HMAC-signed to a local receiver. Proves: 3 categories
        # received + signature verified (wrong secret rejected), retry
        # (500,500 -> 200), replay (cursor reset re-drives), and the SSE stream.
        working-directory: server
        env:
          RMMWAY_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
          RMMWAY_NATS_URL: nats://localhost:4222
        run: go run ./cmd/e2e/webhook
      - name: "automation e2e (W6-3 MILESTONE: one condition -> alert -> self-heal confirm -> ticket -> webhook, all audited)"
        # Closes Block 3 = Phase 1 MVP. A SINGLE condition (one device whose
        # disk is 95% full) drives all four subsystems the production server
        # wires them, on a REAL NATS/JetStream bus: the alert reconciler fires
        # an alert, the seeded disk.full self-heal playbook remediates + the
        # CONFIRM stage re-measures (95 -> 62) to RESOLVE, an automation flow
        # (disk>90 -> open-ticket script -> notify) opens a ticket over the
        # bus, and the webhook framework delivers every resulting event to a
        # user endpoint HMAC-signed. The harness reads back all four Postgres
        # trails (alerts, heal_runs+heal_events, flow_runs+flow_events,
        # webhook_events journal) and ties them to the one condition.
        working-directory: server
        env:
          RMMWAY_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
          RMMWAY_NATS_URL: nats://localhost:4222
        run: go run ./cmd/e2e/automation

  # Gap #9 (W0): one-click onboarding e2e — the REAL installer against a REAL
  # server on a fresh Timescale: build the agent, publish it as a local
  # "release" (binary + SHA256SUMS), run scripts/install.sh (which installs
  # the systemd unit on the runner), and assert the enrolled device comes
  # online AND metrics flow, within 60 s. This is exactly what a customer's
  # pasted line does. /healthz is allowed to report degraded (redis/minio/
  # meili are not part of this lean job) — the assertions are the proof.
  installer-e2e:
    name: Installer e2e (gap #9: one-click onboarding)
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 10
    services:
      timescale:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_DB: rmmway
          POSTGRES_USER: rmmway
          POSTGRES_PASSWORD: rmmway
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rmmway -d rmmway"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
        options: >-
          --jetstream --port 4222 --http_port 8222
          --health-cmd "wget -qO- http://localhost:8222/healthz"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      RMMWAY_PG_DSN: postgres://rmmway:rmmway@localhost:5432/rmmway
      RMMWAY_NATS_URL: nats://localhost:4222
      # The installer derives the agent's mTLS dial target from --server
      # (localhost -> localhost:50052); the mTLS cert must carry a
      # "localhost" SAN for the agent's hostname verification to pass.
      RMMWAY_GRPC_MTLS_SANs: localhost
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: Build the linux/amd64 agent (static, same flags as scripts/build-agent.sh)
        working-directory: agent
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags "-s -w -X main.version=0.0.0-e2e -X main.commit=$(git rev-parse --short HEAD) -X main.date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/rmmway-agent-linux-amd64 ./cmd/agent
          ./dist/rmmway-agent-linux-amd64 --version
      - name: Serve a local "release" dir (binary + SHA256SUMS) on 127.0.0.1:8088
        run: |
          set -euo pipefail
          (cd agent/dist && sha256sum rmmway-agent-linux-amd64 > SHA256SUMS && cat SHA256SUMS)
          python3 -m http.server 8088 --bind 127.0.0.1 --directory agent/dist > /tmp/rmmway-filesrv.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8088/SHA256SUMS > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8088/SHA256SUMS
      - name: Boot the server from source (fresh Timescale — migrations on boot)
        working-directory: server
        run: |
          set -euo pipefail
          go build -o /tmp/rmmway-server ./cmd/server
          /tmp/rmmway-server > /tmp/rmmway-server.log 2>&1 &
          # /healthz is 503 while any probe is degraded (this lean job has no
          # redis/minio/meili), so wait for the login API to answer 200 —
          # that means the server is fully booted (migrations + PKI included).
          for i in $(seq 1 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -X POST localhost:8080/api/login -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}')
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "server did not boot"; tail -50 /tmp/rmmway-server.log; exit 1; }
          tail -20 /tmp/rmmway-server.log
      - name: Mint the operator token + one-time bootstrap code
        run: |
          set -euo pipefail
          TOKEN=$(curl -fsS -X POST localhost:8080/api/login \
            -H 'Content-Type: application/json' -d '{"username":"admin","password":"admin"}' \
            | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')
          [ -n "$TOKEN" ] || { echo "login failed"; exit 1; }
          OUT=$(curl -fsS -X POST localhost:8080/api/bootstrap -H "Authorization: Bearer $TOKEN" -d '{}')
          BOOT=$(printf '%s' "$OUT" | sed -n 's/.*"bootstrap_token":"\([^"]*\)".*/\1/p')
          DEVID=$(printf '%s' "$OUT" | sed -n 's/.*"device_id":"\([^"]*\)".*/\1/p')
          [ -n "$BOOT" ] && [ -n "$DEVID" ] || { echo "bootstrap mint failed: $OUT"; exit 1; }
          echo "TOKEN=$TOKEN" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_TOKEN=$BOOT" >> "$GITHUB_ENV"
          echo "DEVICE_ID=$DEVID" >> "$GITHUB_ENV"
      - name: Run the REAL installer (one pasted line; systemd unit on the runner)
        env:
          RMMWAY_DOWNLOAD_BASE: http://127.0.0.1:8088
        run: |
          set -euo pipefail
          ./scripts/install.sh \
            --server http://localhost:8080 \
            --bootstrap "$BOOTSTRAP_TOKEN" \
            --version 0.0.0-e2e
          echo "--- /etc/rmmway/agent.env (token redacted) ---"
          sed 's/^RMMWAY_BOOTSTRAP_TOKEN=.*/RMMWAY_BOOTSTRAP_TOKEN=<redacted>/' /etc/rmmway/agent.env
          echo "--- unit state ---"
          systemctl is-active rmmway-agent.service || true
      - name: Assert the device is online and metrics flow (<= 60 s)
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 60 ))
          ok=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            if curl -fsS localhost:8080/api/devices -H "Authorization: Bearer $TOKEN" \
              | grep -q "\"id\":\"$DEVICE_ID\"" \
              && curl -fsS "localhost:8080/api/devices/$DEVICE_ID/metrics?range=1h" \
                -H "Authorization: Bearer $TOKEN" | grep -q '"count":[1-9]'; then
              ok="yes"
              break
            fi
            sleep 2
          done
          if [ "$ok" != "yes" ]; then
            echo "FAIL: device $DEVICE_ID online + metrics flowing within 60 s"
            echo "== server log =="; tail -50 /tmp/rmmway-server.log
            echo "== agent unit =="; systemctl status rmmway-agent.service --no-pager || true
            journalctl -u rmmway-agent --no-pager 2>/dev/null | tail -40 || true
            exit 1
          fi
          echo "PASS: the installer enrolled the device and metrics flow (gap #9 closed)"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - name: go build (agent)
        working-directory: agent
        run: go build -o bin/agent ./cmd/agent
      - name: go build (server)
        working-directory: server
        run: go build -o bin/server ./cmd/server
      - name: Cross-compile agent (static, 5 targets)
        run: |
          make agent
          ls -lh agent/dist/
          file agent/dist/*
      - name: "Verify static (linux/amd64): ldd + version"
        run: |
          file agent/dist/rmmway-agent-linux-amd64
          ldd agent/dist/rmmway-agent-linux-amd64 2>&1 | grep -Ei 'not a dynamic|statically linked'
          ./agent/dist/rmmway-agent-linux-amd64 --version
      # W4-1: CycloneDX SBOM for every agent binary (pinned syft via script).
      - name: Generate agent SBOMs (CycloneDX, W4-1)
        run: |
          ./scripts/install-syft.sh
          make sbom-agent
      - name: Upload agent binaries
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmmway-agent
          path: agent/dist/*
          retention-days: 7
      - name: Upload agent SBOMs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmmway-sboms
          path: agent/dist/*.cdx.json
          retention-days: 7

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: npm ci + build
        working-directory: frontend
        run: npm ci && npm run build

  docker:
    name: Docker image (server)
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR repo names must be lowercase; github.repository keeps the
          # owner's case (WelcomeToTheWeb/rmmway). Hardcoded lowercase to
          # keep the expression simple (the repo name is stable).
          images: ghcr.io/welcometotheweb/rmmway
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Build (and push on main)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # W4-1: also export the built image to a tar so the SBOM step can
          # scan the exact bytes (registry push only happens on main).
          outputs: type=docker,dest=server-image.tar
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # W4-1: CycloneDX SBOM for the server image (Go modules + OS packages
      # of the distroless base), scanned from the exported tar.
      - name: Generate image SBOM (CycloneDX, W4-1)
        run: |
          ./scripts/install-syft.sh
          bin/syft docker-archive:server-image.tar \
            -o cyclonedx-json=dist/rmmway-server.cdx.json -q
          ls -lh dist/rmmway-server.cdx.json
      - name: Upload image SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rmmway-server-sbom
          path: dist/rmmway-server.cdx.json
          retention-days: 7
      # W3-4: sign every pushed server image with cosign/Sigstore (keyless,
      # GitHub OIDC). Verify with: cosign verify ghcr.io/welcometotheweb/rmmway@<digest>
      - name: Install cosign
        if: github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3
      - name: Sign image (keyless Sigstore)
        if: github.ref == 'refs/heads/main'
        run: cosign sign --yes "ghcr.io/welcometotheweb/rmmway@${{ steps.build.outputs.digest }}"
      # W4-1: attach the image SBOM to the pushed digest in GHCR so it
      # travels with the image (cosign download sbom <image> to retrieve).
      - name: Attach SBOM to image (GHCR)
        if: github.ref == 'refs/heads/main'
        run: >
          cosign attach sbom --sbom dist/rmmway-server.cdx.json --type cyclonedx
          "ghcr.io/welcometotheweb/rmmway@${{ steps.build.outputs.digest }}"
      - name: Verify signature (self-check)
        if: github.ref == 'refs/heads/main'
        run: |
          cosign verify \
            --certificate-identity-regexp "https://github.com/${GITHUB_REPOSITORY}/.*" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/welcometotheweb/rmmway@${{ steps.build.outputs.digest }}"
